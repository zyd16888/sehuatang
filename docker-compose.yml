version: '3.8'

services:
  sehuatang-crawler:
    image: cxsz16888/sehuatang:latest
    container_name: sehuatang-crawler
    restart: unless-stopped

    # 环境变量
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=Asia/Shanghai
      - DOCKER_CONTAINER=true
      - RUN_MODE=scheduler
      - PYTHONPATH=/app
      # 启用 CF 过盾时取消下行注释（同时配置 flaresolverr profile）
      # - SHT_HTTP_CLIENT_FLARESOLVERR_URL=http://flaresolverr:8191/v1

    # 挂载卷
    volumes:
      - ./config:/app/config:ro  # 配置文件（只读）
      - ./logs:/app/logs         # 日志文件
      - crawler_data:/app/data   # 数据目录

    # 网络配置
    networks:
      - crawler_network

    # 资源限制（HTTP 抓取无需大内存）
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 64M
          cpus: '0.1'

    # 日志配置
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # 默认命令
    command: ["python", "docker_run.py"]

  # CF 过盾服务（仅在遇到 Cloudflare 挑战时需要，用 --profile flaresolverr 启动）
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    restart: unless-stopped
    profiles: ["flaresolverr"]
    environment:
      - LOG_LEVEL=info
      - TZ=Asia/Shanghai
    ports:
      - "8191:8191"
    networks:
      - crawler_network

  # Telegram Bot (可选，使用 --profile bot 启动)
  telegram-bot:
    image: cxsz16888/sehuatang:latest
    container_name: sehuatang-bot
    restart: unless-stopped
    profiles: ["bot"]

    command: ["python", "run.py", "--mode", "bot"]

    environment:
      - PYTHONUNBUFFERED=1
      - TZ=Asia/Shanghai

    volumes:
      - ./config:/app/config:ro
      - ./logs:/app/logs

    networks:
      - crawler_network

    depends_on:
      - sehuatang-crawler

# 网络配置
networks:
  crawler_network:
    driver: bridge
    name: sehuatang_network

# 数据卷
volumes:
  crawler_data:
    name: sehuatang_data