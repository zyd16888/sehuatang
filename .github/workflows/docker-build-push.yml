name: 构建并推送Docker镜像

on:
  push:
    branches: [ main, master, v2]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v2
      
      - name: 设置Docker Buildx
        uses: docker/setup-buildx-action@v1
      
      - name: 登录Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: 构建并推送镜像
        uses: docker/build-push-action@v2
        with:
          context: .
          push: true
          tags: cxsz16888/sehuatang:latest
          cache-from: type=registry,ref=cxsz16888/sehuatang:buildcache
          cache-to: type=registry,ref=cxsz16888/sehuatang:buildcache,mode=max 