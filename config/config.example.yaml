# 配置文件示例
# 请复制此文件为 config.yaml 并填入真实配置

mongodb:
  enable: true
  db_host: "your_mongodb_host"
  db_port: 27017
  connection_string: "mongodb+srv://username:password@cluster.mongodb.net/database"
  use_conn_str: true

sehuatang:
  # 域名
  domain_name: "sehuatang.org"
  domain_get_url: "https://sehuatang.org/forum-103-1.html"
  cookie: "your_cookie_here"
  # 板块id
  fid:
    103: "高清中文字幕"
    104: "素人有码系列"
    # 可以添加更多板块
    # 37: "亚洲有码原创"
    # 36: "亚洲无码原创"

  # 抓取页数，10代表1-10页
  page_num: 5
  # 抓取日期(格式: yyyy-mm-dd), 如果为空, 则抓取当前日期
  # 支持正则匹配，可输入 yyyy-mm 抓取指定月份的所有日期
  date: null

javbee:
  base_url: "https://javbee.co"
  start_path: "/new"
  page_limit: 30

x1080x:
  # 站点镜像域名频繁更换，可用 CRAWLER_X1080X_BASE_URL 覆盖
  base_url: "https://agaghhh.cc"
  fid: 244
  # 每个分类抓取的 archiver 列表页数（增量抓取 3 页足够，补历史时调大）
  page_limit: 3
  # typeid -> 分类名；站点分类调整时在此覆盖
  typeids:
    "5212": "国内成人"
    "5206": "亚洲有码"
    "5207": "亚洲无码"
    "5208": "FC2"
    "5216": "MGS"
    "5479": "中文字幕"
    "5213": "探花精选"
    "5217": "主播精选"

# 多来源爬虫公共配置。来源配置覆盖 defaults。
crawler:
  # 失败台账自动重试：定期检查各来源到期（next_retry_at 已过）的失败记录，
  # 有则自动触发 retry_failed；没有则静默跳过。默认开启、每 60 分钟一次。
  retry_failed:
    enabled: true
    interval_minutes: 60
    # 每条失败台账的累计上限，包含首次失败；达到后保留记录并停止重试。
    max_failures: 5
  defaults:
    concurrency: 4
    http:
      timeout: 30
      impersonate: "chrome110"
      retry:
        attempts: 3
        base_delay: 2
        max_delay: 15
        jitter: 0.3
        statuses: [408, 425, 429, 500, 502, 503, 504]
  sources:
    sehuatang:
      enabled: true
      concurrency: 6
      http:
        timeout: 30
        proxy:
          enabled: true
          # 生产环境建议留空，并使用 CRAWLER_SEHUATANG_PROXY_URL
          url: "http://127.0.0.1:7890"
      challenge:
        # docker 部署配合 byparr 服务时填 http://byparr:8191/v1
        flaresolverr_url: ""
      schedule:
        cron: "0 2 * * *"
    javbee:
      enabled: false
      concurrency: 3
      http:
        # JavBee 偶发 20 秒以上无首字节，使用更宽松的来源级超时。
        timeout: 60
        proxy:
          enabled: false
          # 启用时同时设置 CRAWLER_JAVBEE_PROXY_ENABLED=true 和下列 URL
          url: ""
      refresh:
        mode: "stale_after"  # refresh_all / new_only / stale_after
        days: 7
      schedule:
        cron: "30 2 * * *"
    x1080x:
      enabled: false
      # 增量抓到新数据时发送 Telegram 推送（沿用 sendMessage 配置；
      # dry-run / retry-failed / 补抓不推送）
      notify_telegram: true
      # CF 过盾后请求走直连，低并发降低重新触发挑战概率
      concurrency: 2
      http:
        timeout: 30
        # cf_clearance 绑定浏览器指纹，直连必须与过盾浏览器同族：
        # byparr(Camoufox) 是 Firefox 内核，指纹用 firefox 系列；
        # 若换回 FlareSolverr(Chrome) 则改回 chrome 系列并同步 UA
        impersonate: "firefox147"
        user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:151.0) Gecko/20100101 Firefox/151.0"
        proxy:
          enabled: false
          url: ""
      challenge:
        # 站点有 Cloudflare JS 挑战，必须配置 FlareSolverr 兼容服务
        # （docker 部署填 http://byparr:8191/v1，
        #   或用环境变量 CRAWLER_X1080X_FLARESOLVERR_URL）
        flaresolverr_url: ""
      schedule:
        cron: "0 3 * * *"

proxy:
  # 旧通知模块使用的代理；爬虫请求请使用 crawler.sources.*.http.proxy
  proxy_url: "http://127.0.0.1:7890"
  proxy_enable: true

sendMessage:
  # Telegram 通知
  send_telegram_enable: true
  tg_bot_token: "your_bot_token"
  tg_chat_id: "your_chat_id"
  image_proxy_url: "https://your-image-proxy.com"

# Web 管理页（--mode web）
web:
  # 本机默认 127.0.0.1；docker 内默认 0.0.0.0
  host: "127.0.0.1"
  port: 8181
  # 监听非本机地址时必须设置 token（或环境变量 SHT_WEB_TOKEN），
  # 未设置 token 时仅允许本机访问
  token: ""

# 日志配置
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR, CRITICAL
  max_file_size: 10485760  # 10MB
  backup_count: 5
  console_output: true
