# 配置文件示例
# 请复制此文件为 config.yaml 并填入真实配置

mongodb:
  enable: true
  db_host: "your_mongodb_host"
  db_port: 27017
  connection_string: "mongodb+srv://username:password@cluster.mongodb.net/database"
  use_conn_str: true

mysql:
  enable: false
  host: "localhost"
  port: 3306
  user: "your_username"
  password: "your_password"
  db: "sehuatang"

sehuatang:
  # 域名
  domain_name: "sehuatang.org"
  domain_get_url: "https://sehuatang.org/forum-103-1.html"
  cookie: "your_cookie_here"
  # 板块id
  fid:
    103: "高清中文字幕"
    104: "素人有码系列"
    # 可以添加更多板块
    # 37: "亚洲有码原创"
    # 36: "亚洲无码原创"

  # 抓取页数，10代表1-10页
  page_num: 5
  # 抓取日期(格式: yyyy-mm-dd), 如果为空, 则抓取当前日期
  # 支持正则匹配，可输入 yyyy-mm 抓取指定月份的所有日期
  date: null

javbee:
  # 是否在 scheduler/once 主任务中抓取 Javbee；也可用 --mode javbee 强制单独执行
  enable: false
  base_url: "https://javbee.co"
  start_path: "/new"
  page_limit: 30
  concurrent_workers: 6
  request_timeout: 20
  retry_attempts: 3
  # Javbee 当前可直连，代理配置与 sehuatang 相互独立
  proxy_enable: false
  proxy_url: ""

proxy:
  # 代理服务器
  proxy_url: "http://127.0.0.1:7890"
  # 是否使用代理
  proxy_enable: true

# HTTP 抓取配置（curl_cffi）
http_client:
  # 并发抓取线程数（列表/详情共用）
  concurrent_workers: 6
  # 单次请求超时（秒）
  request_timeout: 15
  # FlareSolverr 服务地址，遇到 Cloudflare 时自动过盾，留空则放弃当次抓取
  # 例：http://localhost:8191/v1
  flaresolverr_url: ""

sendMessage:
  # 企业微信推送
  send_wecom_enable: false
  corp_id: "your_corp_id"
  corp_secret: "your_corp_secret"
  agent_id: 1000002
  media_id: "your_media_id"
  to_user: "@all"
  
  # Telegram 推送
  send_telegram_enable: true
  tg_bot_token: "your_bot_token"
  tg_chat_id: "your_chat_id"
  image_proxy_url: "https://your-image-proxy.com"

# 定时任务配置
schedule:
  # 简单时间配置（已废弃，建议使用cron）
  schedule_time:
    - "01:00"
    - "02:00"
    - "03:00"
    - "04:00"
  
  # Cron表达式配置（推荐）
  # 格式：分 时 日 月 周
  # 示例：每天凌晨2点执行
  schedule_cron: "0 2 * * *"

# 日志配置
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR, CRITICAL
  max_file_size: 10485760  # 10MB
  backup_count: 5
  console_output: true

# 性能配置
performance:
  max_concurrent_requests: 10
  request_timeout: 30
  retry_attempts: 3
  retry_delay: 5


# 浏览器配置
browser:
  # 多标签页配置
  max_tabs: 3  # 最大标签页数量，建议2-5个，过多可能导致内存占用过高
  tab_timeout: 30  # 获取标签页的超时时间（秒）
  enable_multi_tab: true  # 是否启用多标签页模式，false则使用传统单页面模式

  # 智能等待配置（新功能）
  wait_strategy: "smart"  # 等待策略: "smart"(智能等待) 或 "random"(随机等待)
  doc_load_timeout: 15    # 文档加载超时时间（秒），建议10-20秒
  min_wait_time: 1        # 最小等待时间（秒），确保页面稳定
  max_wait_time: 3        # 最大等待时间（秒），平衡速度和稳定性

  # 传统等待配置（备用）
  sleep_range: [3, 5]     # 随机等待时间范围（秒），仅在wait_strategy为"random"时使用

  # 浏览器基础配置
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
  max_retries: 3  # 页面加载失败时的最大重试次数
  sleep_range: [2, 4]  # 页面加载后的随机等待时间范围（秒）
  page_load_timeout: 30  # 页面加载超时时间（秒）
  cloudflare_timeout: 10  # Cloudflare验证超时时间（秒）

  # 浏览器启动参数（高级配置）
  arguments:
    - "--headless=new"              # 无头浏览器模式
    - "--no-sandbox"                # Docker环境必需
    - "--disable-dev-shm-usage"     # 禁用/dev/shm使用
    - "--disable-gpu"               # 禁用GPU加速
    - "--disable-extensions"        # 禁用扩展
    - "--disable-setuid-sandbox"    # 禁用setuid沙盒
    - "--remote-debugging-port=9222" # 远程调试端口
    - "--disable-web-security"      # 禁用Web安全
    - "--ignore-certificate-errors" # 忽略证书错误
